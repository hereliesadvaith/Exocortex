<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141517" media="(prefers-color-scheme: dark)">
<title>Todos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233f5bb5'/%3E%3Cpath d='M8 10h3M8 16h3M8 22h3M14 10h10M14 16h10M14 22h7' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f5f5f2;
  --surface: #ffffff;
  --surface-2: #ecece8;
  --text: #1b1c1e;
  --muted: #6a6c70;
  --line: #e0e0db;
  --accent: #3f5bb5;
  --accent-soft: #dde3f6;
  --accent-text: #ffffff;
  --danger: #c0392b;
  --p3: #d1453b;
  --p2: #d98a0b;
  --p1: #3f7fd1;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141517;
    --surface: #1d1e21;
    --surface-2: #28292d;
    --text: #ebebee;
    --muted: #9a9ba1;
    --line: #2e2f33;
    --accent: #8ea4ec;
    --accent-soft: #2b3555;
    --accent-text: #10152a;
    --danger: #ec7a6c;
    --p3: #ef6f63;
    --p2: #eba63c;
    --p1: #6ea6ec;
    --shadow: none;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 96px; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
h1 { font-size: 28px; line-height: 1.1; margin: 0; letter-spacing: -.02em; }
.date { color: var(--muted); font-size: 14px; margin-top: 4px; }
.summary { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
.summary b { display: block; font-size: 22px; color: var(--text); }
.summary .late { color: var(--danger); font-weight: 600; }

.search { position: relative; margin-bottom: 14px; }
.search .mag { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { padding: 12px 44px 12px 42px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); -webkit-appearance: none; appearance: none; }
.search input::-webkit-search-cancel-button { display: none; }
.search .clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--muted); width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; }
.tabs.dim { opacity: .45; }

.fab { position: fixed; right: max(16px, calc(50% - 304px)); bottom: calc(20px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-text); box-shadow: 0 4px 14px rgba(0,0,0,.25); display: grid; place-items: center; z-index: 5; }
.fab:active { transform: scale(.95); }

.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; margin-bottom: 10px; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 8px 4px; border-radius: 9px; color: var(--muted); font-weight: 600; font-size: 14px; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.tabs .n { font-weight: 500; font-size: 12px; margin-left: 3px; opacity: .8; font-variant-numeric: tabular-nums; }

.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; margin-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 5px 12px; font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.chips button[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--text); font-weight: 600; }
.chips .n { font-size: 12px; font-variant-numeric: tabular-nums; opacity: .75; }
.chips .new { border-style: dashed; }

.section-title { display: flex; align-items: baseline; justify-content: space-between; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; margin: 18px 4px 8px; }
.section-title.late { color: var(--danger); }
.section-title .link { text-transform: none; letter-spacing: 0; font-size: 13px; }

.group { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.task { display: flex; align-items: flex-start; gap: 4px; padding: 4px 8px 4px 4px; transition: opacity .25s; }
.task + .task { border-top: 1px solid var(--line); }
.tick { flex: none; border: 0; background: transparent; width: 44px; height: 44px; display: grid; place-items: center; padding: 0; }
.tick i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; color: transparent; transition: background .15s, border-color .15s, transform .1s; }
.tick:active i { transform: scale(.9); }
.task.p1 .tick i { border-color: var(--p1); background: color-mix(in srgb, var(--p1) 10%, transparent); }
.task.p2 .tick i { border-color: var(--p2); background: color-mix(in srgb, var(--p2) 12%, transparent); }
.task.p3 .tick i { border-color: var(--p3); background: color-mix(in srgb, var(--p3) 14%, transparent); }
.task.done .tick i { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.task .body { flex: 1; min-width: 0; border: 0; background: transparent; text-align: left; padding: 11px 0 10px; }
.task .title { overflow-wrap: anywhere; }
.task.done .title { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.task .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: 13px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.task .meta:empty { display: none; }
.task .meta span { display: inline-flex; align-items: center; gap: 3px; }
.task .meta .late { color: var(--danger); font-weight: 600; }
.task .meta .today { color: var(--accent); font-weight: 600; }
.task .notes { color: var(--muted); font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task.leaving { opacity: .35; }

.link { border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 4px; }
.empty { text-align: center; color: var(--muted); padding: 44px 16px; }
.empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }

dialog { border: 0; border-radius: 20px; padding: 0; background: var(--surface); color: var(--text); width: min(440px, calc(100vw - 32px)); max-height: calc(100vh - 32px); box-shadow: 0 10px 40px rgba(0,0,0,.3); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog form { padding: 20px; display: grid; gap: 14px; }
dialog h2 { margin: 0; font-size: 19px; }
label, .label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
input, select, textarea { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; font-weight: 400; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
textarea { resize: vertical; min-height: 72px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 10px; }
.seg label { display: block; }
.seg input { position: absolute; opacity: 0; pointer-events: none; width: auto; }
.seg span { display: flex; align-items: center; justify-content: center; gap: 5px; padding: 8px 2px; border-radius: 7px; color: var(--muted); font-size: 14px; font-weight: 500; }
.seg span i { width: 9px; height: 9px; border-radius: 50%; }
.seg input:checked + span { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { border: 1px solid var(--line); background: var(--bg); border-radius: 16px; padding: 5px 12px; font-size: 14px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 4px; }
.actions .left { margin-right: auto; }
.btn { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 650; background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-text); }
.btn.danger { background: transparent; color: var(--danger); padding: 10px 8px; }
[hidden] { display: none !important; }

.toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 6px 6px 6px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100vw - 32px); box-shadow: 0 4px 14px rgba(0,0,0,.25); display: flex; align-items: center; gap: 12px; min-height: 44px; }
.toast button { border: 0; background: transparent; color: var(--accent-soft); font-weight: 700; padding: 8px 10px; border-radius: 8px; }
@media (prefers-color-scheme: dark) { .toast button { color: var(--accent-text); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Todos</h1>
      <div class="date" id="date"></div>
    </div>
    <div class="summary" id="summary"></div>
  </header>

  <div class="search" role="search">
    <svg class="mag" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search tasks" aria-label="Search tasks" autocomplete="off" enterkeyhint="search">
    <button type="button" class="clear" id="qClear" aria-label="Clear search" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="today">Today</button>
    <button role="tab" data-tab="upcoming">Upcoming</button>
    <button role="tab" data-tab="all">All</button>
    <button role="tab" data-tab="done">Done</button>
  </div>

  <div class="chips" id="chips"></div>

  <main id="main"></main>
</div>

<button class="fab" id="add" aria-label="New task">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<dialog id="taskDialog">
  <form method="dialog" id="taskForm">
    <h2 id="taskHead">New task</h2>
    <label>Task <input name="title" required maxlength="300" autocomplete="off" placeholder="What needs doing?"></label>
    <label>Notes <textarea name="notes" maxlength="5000" placeholder="Optional"></textarea></label>
    <div class="label">Due
      <input name="due_on" type="date">
      <div class="quick" id="dueQuick">
        <button type="button" data-due="0">Today</button>
        <button type="button" data-due="1">Tomorrow</button>
        <button type="button" data-due="week">Next week</button>
        <button type="button" data-due="">No date</button>
      </div>
    </div>
    <div class="label">Priority
      <div class="seg">
        <label><input type="radio" name="priority" value="0" checked><span>None</span></label>
        <label><input type="radio" name="priority" value="1"><span><i style="background:var(--p1)"></i>Low</span></label>
        <label><input type="radio" name="priority" value="2"><span><i style="background:var(--p2)"></i>Med</span></label>
        <label><input type="radio" name="priority" value="3"><span><i style="background:var(--p3)"></i>High</span></label>
      </div>
    </div>
    <div class="two">
      <label>List <select name="list_id"></select></label>
      <label>Repeat
        <select name="repeat">
          <option value="">Never</option>
          <option value="daily">Every day</option>
          <option value="weekly">Every week</option>
          <option value="monthly">Every month</option>
          <option value="yearly">Every year</option>
        </select>
      </label>
    </div>
    <div class="actions">
      <div class="left"><button type="button" class="btn danger" id="deleteTask" hidden>Delete</button></div>
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="listDialog">
  <form method="dialog" id="listForm">
    <h2 id="listHead">New list</h2>
    <label>Name <input name="name" required maxlength="60" autocomplete="off" placeholder="e.g. Work, Home, Groceries"></label>
    <div class="actions">
      <div class="left"><button type="button" class="btn danger" id="deleteList" hidden>Delete</button></div>
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" hidden><span id="toastMsg"></span><button type="button" id="toastAct" hidden></button></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const I_CAL = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>';
const I_REPEAT = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 014-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 01-4 4H4"/></svg>';
const I_LIST = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>';
const I_EDIT = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>';
const REPEAT_TEXT = { daily: "daily", weekly: "weekly", monthly: "monthly", yearly: "yearly" };

// Dates are "YYYY-MM-DD" strings with arithmetic in UTC, so the phone's time zone
// never shifts a day. "Today" comes from Postgres.
const toDate = s => new Date(s + "T00:00:00Z");
const iso = d => d.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = toDate(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const weekday = s => (toDate(s).getUTCDay() + 6) % 7; // Monday = 0
const fmtDay = (s, opts) => toDate(s).toLocaleDateString(undefined, { timeZone: "UTC", ...opts });

let S = { today: null, lists: [], tasks: [] };
let tab = "today", list = "all", query = "";   // list: "all", "inbox" or a list id
try { tab = localStorage.getItem("todos.tab") || tab; list = localStorage.getItem("todos.list") || list; } catch {}
const remember = () => { try { localStorage.setItem("todos.tab", tab); localStorage.setItem("todos.list", list); } catch {} };

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    let msg = res.statusText;
    try {
      const j = await res.json();
      msg = typeof j.detail === "string" ? j.detail : (j.detail?.[0]?.msg || msg);
    } catch {}
    throw new Error(msg || `HTTP ${res.status}`);
  }
  return res.status === 204 ? null : res.json();
}

let toastTimer, toastAction = null;
function toast(msg, actionLabel, action) {
  $("#toastMsg").textContent = msg;
  $("#toastAct").hidden = !actionLabel;
  $("#toastAct").textContent = actionLabel || "";
  toastAction = action || null;
  $("#toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("#toast").hidden = true; toastAction = null; }, actionLabel ? 5000 : 3500);
}
$("#toastAct").addEventListener("click", () => {
  const a = toastAction;
  $("#toast").hidden = true; toastAction = null;
  if (a) a();
});

async function load() {
  try {
    S = await api("GET", "api/state?done_days=30");
    if (list !== "all" && list !== "inbox" && !S.lists.some(l => String(l.id) === list)) list = "all";
    render();
  } catch (e) {
    toast("Couldn't load: " + e.message);
  }
}

// ---- views ---------------------------------------------------------------

const open = () => S.tasks.filter(t => !t.done_at);
const inList = t => list === "all" || (list === "inbox" ? t.list_id == null : String(t.list_id) === list);
const listName = id => S.lists.find(l => l.id === id)?.name;
const byDue = (a, b) => (a.due_on || "9999") < (b.due_on || "9999") ? -1 : (a.due_on || "9999") > (b.due_on || "9999") ? 1
  : b.priority - a.priority || (a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : a.id - b.id);

function dayLabel(d, { long = false } = {}) {
  const t = S.today;
  if (d === t) return "Today";
  if (d === addDays(t, 1)) return "Tomorrow";
  if (d === addDays(t, -1)) return "Yesterday";
  if (d > t && d <= addDays(t, 6)) return fmtDay(d, { weekday: "long" });
  const sameYear = d.slice(0, 4) === t.slice(0, 4);
  return fmtDay(d, { weekday: long || d > t ? "short" : undefined, day: "numeric", month: "short", year: sameYear ? undefined : "numeric" });
}

function taskRow(t) {
  const done = !!t.done_at;
  const meta = [];
  if (t.due_on && !done) {
    const cls = t.due_on < S.today ? "late" : t.due_on === S.today ? "today" : "";
    meta.push(`<span class="${cls}">${I_CAL}${esc(dayLabel(t.due_on))}</span>`);
  }
  if (t.repeat && !done) meta.push(`<span>${I_REPEAT}${REPEAT_TEXT[t.repeat]}</span>`);
  if (list === "all" && t.list_id != null && tab !== "all") meta.push(`<span>${I_LIST}${esc(listName(t.list_id) || "")}</span>`);
  const name = esc(t.title);
  return `<div class="task p${done ? 0 : t.priority} ${done ? "done" : ""}" data-id="${t.id}">
    <button class="tick" data-act="toggle" aria-label="${done ? "Mark not done" : "Mark done"}: ${name}" aria-pressed="${done}"><i>${CHECK}</i></button>
    <button class="body" data-act="edit" aria-label="Edit: ${name}">
      <div class="title">${name}</div>
      <div class="meta">${meta.join("")}</div>
      ${t.notes ? `<div class="notes">${esc(t.notes.split("\n")[0])}</div>` : ""}
    </button>
  </div>`;
}

const group = (title, tasks, cls = "", extra = "") => !tasks.length ? "" :
  `<div class="section-title ${cls}"><span>${esc(title)}${title ? ` · ${tasks.length}` : ""}</span>${extra}</div><div class="group">${tasks.map(taskRow).join("")}</div>`;

const empty = (head, text) => `<div class="empty"><b>${esc(head)}</b>${esc(text)}</div>`;

function render() {
  const t = S.today;
  const all = open();
  const late = all.filter(x => x.due_on && x.due_on < t).length;
  const dueToday = all.filter(x => x.due_on === t).length;
  $("#date").textContent = t ? fmtDay(t, { weekday: "long", day: "numeric", month: "long" }) : "";
  $("#summary").innerHTML = t ? `<b>${all.length}</b>open${late ? ` · <span class="late">${late} overdue</span>` : dueToday ? ` · ${dueToday} today` : ""}` : "";

  const scoped = all.filter(inList);
  const counts = {
    today: scoped.filter(x => x.due_on && x.due_on <= t).length,
    upcoming: scoped.filter(x => x.due_on > t).length,
    all: scoped.length,
    done: S.tasks.filter(x => x.done_at && inList(x)).length,
  };
  document.querySelectorAll("#tabs button").forEach(b => {
    b.setAttribute("aria-selected", String(b.dataset.tab === tab));
    const n = counts[b.dataset.tab];
    b.innerHTML = `${b.dataset.tab[0].toUpperCase() + b.dataset.tab.slice(1)}${n && b.dataset.tab !== "done" ? `<span class="n">${n}</span>` : ""}`;
  });

  const chip = (key, label, n) => {
    const on = list === key;
    return `<button data-list="${key}" aria-pressed="${on}">${esc(label)}${n ? `<span class="n">${n}</span>` : ""}${on && key !== "all" && key !== "inbox" ? I_EDIT : ""}</button>`;
  };
  $("#chips").innerHTML = chip("all", "All lists", 0)
    + chip("inbox", "Inbox", all.filter(x => x.list_id == null).length)
    + S.lists.map(l => chip(String(l.id), l.name, all.filter(x => x.list_id === l.id).length)).join("")
    + `<button class="new" data-list="new" aria-label="New list">+ List</button>`;

  $("#tabs").classList.toggle("dim", !!query);
  $("#main").innerHTML = query ? renderSearch() : ({ today: renderToday, upcoming: renderUpcoming, all: renderAll, done: renderDone })[tab](scoped);
}

// Every word has to appear in the title or notes; searches all tabs within the picked list.
function renderSearch() {
  const words = query.toLowerCase().split(/\s+/).filter(Boolean);
  const hit = x => { const text = `${x.title} ${x.notes || ""}`.toLowerCase(); return words.every(w => text.includes(w)); };
  const found = S.tasks.filter(x => inList(x) && hit(x));
  if (!found.length) return empty("No matches", `Nothing ${list === "all" ? "" : "in this list "}matches “${query}”.`);
  const openOnes = found.filter(x => !x.done_at).sort(byDue);
  const doneOnes = found.filter(x => x.done_at).sort((a, b) => a.done_at < b.done_at ? 1 : -1);
  return group("Open", openOnes) + group("Done", doneOnes);
}

function renderToday(tasks) {
  const t = S.today;
  const late = tasks.filter(x => x.due_on && x.due_on < t).sort(byDue);
  const today = tasks.filter(x => x.due_on === t).sort(byDue);
  if (!late.length && !today.length) {
    const rest = tasks.length;
    return empty("Nothing due today", rest ? `${rest} other open task${rest === 1 ? "" : "s"} under All.` : "Tap + to add one.");
  }
  return group("Overdue", late, "late") + group("Today", today);
}

function renderUpcoming(tasks) {
  const t = S.today;
  const future = tasks.filter(x => x.due_on > t).sort(byDue);
  if (!future.length) return empty("Nothing scheduled", "Tasks with a due date after today show up here.");
  const days = new Map();
  for (const x of future) (days.get(x.due_on) || days.set(x.due_on, []).get(x.due_on)).push(x);
  return [...days].map(([d, xs]) => group(dayLabel(d, { long: true }), xs)).join("");
}

function renderAll(tasks) {
  if (!tasks.length) return empty("All clear", "No open tasks here. Tap + to add one.");
  const sorted = [...tasks].sort(byDue);
  if (list !== "all") return group("", sorted);
  const out = [group("Inbox", sorted.filter(x => x.list_id == null))];
  for (const l of S.lists) out.push(group(l.name, sorted.filter(x => x.list_id === l.id)));
  return out.join("");
}

function renderDone() {
  const done = S.tasks.filter(x => x.done_at && inList(x)).sort((a, b) => a.done_at < b.done_at ? 1 : -1);
  if (!done.length) return empty("Nothing done yet", "Tasks you tick off in the last 30 days show up here.");
  const days = new Map();
  for (const x of done) (days.get(x.done_on) || days.set(x.done_on, []).get(x.done_on)).push(x);
  let first = true;
  return [...days].map(([d, xs]) => {
    const extra = first ? `<button class="link" data-act="clear">Clear all done</button>` : "";
    first = false;
    return group(dayLabel(d, { long: true }), xs, "", extra);
  }).join("");
}

// ---- search and add ------------------------------------------------------

$("#q").addEventListener("input", e => {
  query = e.target.value.trim();
  $("#qClear").hidden = !e.target.value;
  render();
});
$("#q").addEventListener("keydown", e => {
  if (e.key === "Escape") clearSearch();
  if (e.key === "Enter") e.target.blur();
});
function clearSearch() {
  $("#q").value = ""; query = ""; $("#qClear").hidden = true; render();
}
$("#qClear").addEventListener("click", () => { clearSearch(); $("#q").focus(); });

// A new task starts from where you are: Today makes it due today, Upcoming
// tomorrow, and a picked list puts it in that list.
function newTaskDefaults() {
  return {
    due_on: query ? null : tab === "today" ? S.today : tab === "upcoming" ? addDays(S.today, 1) : null,
    list_id: list === "all" || list === "inbox" ? null : Number(list),
  };
}

$("#add").addEventListener("click", () => openTask(null, newTaskDefaults()));

// ---- task actions --------------------------------------------------------

const taskById = id => S.tasks.find(t => t.id === Number(id));

async function setDone(t, done) {
  try {
    await api("PATCH", `api/tasks/${t.id}`, { done });
  } catch (e) {
    toast("Not saved: " + e.message);
  }
  await load();
}

$("#main").addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  if (b.dataset.act === "clear") return clearDone();
  const t = taskById(b.closest(".task")?.dataset.id);
  if (!t) return;
  if (b.dataset.act === "edit") return openTask(t);
  // Tick: show it done for a moment, then let it move on.
  const row = b.closest(".task");
  const done = !t.done_at;
  row.classList.toggle("done", done);
  row.classList.add("leaving");
  setTimeout(async () => {
    await setDone(t, done);
    if (done) toast(t.repeat ? `Done. Next one ${dayLabelNext(t)}` : "Done", "Undo", () => setDone(t, false));
  }, 300);
});

function dayLabelNext(t) {
  const next = S.tasks.find(x => !x.done_at && x.title === t.title && x.repeat === t.repeat && x.due_on > S.today);
  return next ? dayLabel(next.due_on).toLowerCase() : "is scheduled";
}

async function clearDone() {
  const n = S.tasks.filter(x => x.done_at).length;
  if (!confirm(`Delete all ${n} completed task${n === 1 ? "" : "s"}? This can't be undone.`)) return;
  try { await api("DELETE", "api/done"); } catch (e) { toast(e.message); }
  load();
}

document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => {
  tab = b.dataset.tab; remember();
  if (query) { $("#q").value = ""; query = ""; $("#qClear").hidden = true; }
  render();
}));

$("#chips").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  const key = b.dataset.list;
  if (key === "new") return openList(null);
  if (key === list && key !== "all" && key !== "inbox") return openList(S.lists.find(l => String(l.id) === key));
  list = key; remember(); render();
});

document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => b.closest("dialog").close()));
document.querySelectorAll("dialog").forEach(d => d.addEventListener("click", e => { if (e.target === d) d.close(); }));

// ---- task dialog ---------------------------------------------------------

let editing = null;
const tf = $("#taskForm");

function openTask(t, defaults = {}) {
  editing = t;
  tf.reset();
  $("#taskHead").textContent = t ? (t.done_at ? "Completed task" : "Edit task") : "New task";
  tf.list_id.innerHTML = `<option value="">Inbox</option>` + S.lists.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join("");
  const v = t || defaults;
  tf.title.value = v.title || "";
  tf.notes.value = v.notes || "";
  tf.due_on.value = v.due_on || "";
  tf.priority.value = String(v.priority || 0);
  tf.list_id.value = v.list_id == null ? "" : String(v.list_id);
  tf.repeat.value = v.repeat || "";
  $("#deleteTask").hidden = !t;
  $("#taskDialog").showModal();
  if (!t) tf.title.focus();
}

$("#dueQuick").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  const d = b.dataset.due;
  tf.due_on.value = d === "" ? "" : d === "week" ? addDays(S.today, 7 - weekday(S.today)) : addDays(S.today, Number(d));
});

tf.addEventListener("submit", async e => {
  e.preventDefault();
  const body = {
    title: tf.title.value.trim(),
    notes: tf.notes.value.trim() || null,
    due_on: tf.due_on.value || null,
    priority: Number(tf.priority.value),
    list_id: tf.list_id.value ? Number(tf.list_id.value) : null,
    repeat: tf.repeat.value || null,
  };
  if (body.repeat && !body.due_on) return toast("A repeating task needs a due date");
  try {
    if (editing) await api("PATCH", `api/tasks/${editing.id}`, body);
    else await api("POST", "api/tasks", body);
    $("#taskDialog").close();
    load();
  } catch (err) {
    toast(err.message);
  }
});

$("#deleteTask").addEventListener("click", async () => {
  if (!editing) return;
  const t = editing;
  $("#taskDialog").close();
  try {
    await api("DELETE", `api/tasks/${t.id}`);
    await load();
    toast("Deleted", "Undo", async () => {
      try {
        await api("POST", "api/tasks", { title: t.title, notes: t.notes, list_id: t.list_id, due_on: t.due_on, priority: t.priority, repeat: t.repeat });
        if (t.done_at) toast("Restored as not done");
      } catch (e) { toast(e.message); }
      load();
    });
  } catch (e) { toast(e.message); }
});

// ---- list dialog ---------------------------------------------------------

let editingList = null;
const lf = $("#listForm");

function openList(l) {
  editingList = l;
  lf.reset();
  $("#listHead").textContent = l ? "Edit list" : "New list";
  lf.name.value = l?.name || "";
  $("#deleteList").hidden = !l;
  $("#listDialog").showModal();
  lf.name.focus();
}

lf.addEventListener("submit", async e => {
  e.preventDefault();
  try {
    const name = lf.name.value.trim();
    const res = editingList
      ? await api("PATCH", `api/lists/${editingList.id}`, { name })
      : await api("POST", "api/lists", { name });
    $("#listDialog").close();
    list = String(res.id); remember();
    load();
  } catch (err) { toast(err.message); }
});

$("#deleteList").addEventListener("click", async () => {
  const l = editingList;
  if (!l) return;
  const n = open().filter(x => x.list_id === l.id).length;
  if (!confirm(`Delete the list "${l.name}"?${n ? ` Its ${n} open task${n === 1 ? "" : "s"} move to the Inbox.` : ""}`)) return;
  try {
    await api("DELETE", `api/lists/${l.id}`);
    $("#listDialog").close();
    list = "all"; remember();
    load();
  } catch (err) { toast(err.message); }
});

// Pick up a new day (and edits from Claude) when the tab comes back into view.
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });

load();
</script>
</body>
</html>
