<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f0f0ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Todos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23d71921'/%3E%3C/svg%3E">
<link rel="preload" href="/fonts/doto.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/ui.css">
<script src="/ui.js"></script>
<style>
main { padding-bottom: 110px; }
.app-top .side .late { color: var(--red); }

/* Search */
.search { position: relative; margin-bottom: 12px; }
.search .mag { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input[type="search"] { padding: 13px 46px 13px 44px; border-radius: 999px; background: var(--card); -webkit-appearance: none; appearance: none; }
.search input::-webkit-search-cancel-button { display: none; }
.search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); }

.tabs.dim { opacity: 0.45; }
.tabs .n { margin-left: 5px; opacity: 0.6; font-weight: 400; }

/* List chips */
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; margin-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; background: var(--card); text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; padding: 8px 12px; }
.chips .chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
.chips .chip .n { opacity: 0.6; }
.chips .chip.new { border-style: dashed; background: transparent; }

.section-title.late { color: var(--red); }
.section-title .link { margin-left: auto; }

/* Task groups */
.group { background: var(--card); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; }
.task { display: flex; align-items: flex-start; gap: 2px; padding: 4px 10px 4px 4px; transition: opacity 0.25s; }
.task + .task { border-top: 1px dotted var(--line); }
.tick { flex: none; border: 0; background: transparent; width: 46px; height: 46px; display: grid; place-items: center; padding: 0; }
/* The ring says the priority: hairline (none), thin, bold, red (high). */
.tick i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: transparent;
  box-shadow: inset 0 0 0 1.5px var(--muted); transition: background 0.15s, box-shadow 0.15s, transform 0.1s; }
.tick:active i { transform: scale(0.88); }
.task.p1 .tick i { box-shadow: inset 0 0 0 1.5px var(--text); }
.task.p2 .tick i { box-shadow: inset 0 0 0 3px var(--text); }
.task.p3 .tick i { box-shadow: inset 0 0 0 3px var(--red); }
.task.done .tick i { background: var(--text); box-shadow: none; color: var(--bg); }
.task .body { flex: 1; min-width: 0; border: 0; background: transparent; text-align: left; padding: 12px 0 11px; }
.task .title { font-size: 15.5px; line-height: 1.3; overflow-wrap: anywhere; }
.task.done .title { color: var(--muted); text-decoration: line-through; }
.task .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 5px; font: 10.5px/1.3 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.task .meta:empty { display: none; }
.task .meta span { display: inline-flex; align-items: center; gap: 4px; }
.task .meta .late { color: var(--red); }
.task .meta .today { color: var(--text); font-weight: 700; }
.task .notes { margin-top: 4px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task.leaving { opacity: 0.35; }
.link { border: 0; background: transparent; padding: 4px; font: 700 11px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); }

/* Priority picker: 0-3 dots */
.seg span .pd { display: inline-flex; gap: 2px; margin-right: 5px; padding: 0; border-radius: 0; vertical-align: middle; }
.seg span .pd i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.seg span .pd.hi i { background: var(--red); }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }

/* Toast with an Undo button */
.toast { display: flex; align-items: center; gap: 12px; padding: 6px 6px 6px 16px; min-height: 42px; bottom: max(90px, calc(86px + env(safe-area-inset-bottom))); }
.toast button { border: 0; background: transparent; color: var(--red); padding: 8px 12px; border-radius: 999px; font: 700 11px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }
</style>
</head>
<body>
<main>
  <a class="back" href="/">Home</a>
  <header class="app-top">
    <div>
      <h1>Todos</h1>
      <p class="sub" id="date">&nbsp;</p>
    </div>
    <div class="side" id="summary"></div>
  </header>

  <div class="search" role="search">
    <svg class="mag" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search tasks" aria-label="Search tasks" autocomplete="off" enterkeyhint="search">
    <button type="button" class="icon-btn clear" id="qClear" aria-label="Clear search" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="today">Today</button>
    <button role="tab" data-tab="upcoming">Upcoming</button>
    <button role="tab" data-tab="all">All</button>
    <button role="tab" data-tab="done">Done</button>
  </div>

  <div class="chips" id="chips"></div>

  <div id="list"></div>
</main>

<button class="fab" id="add" aria-label="New task">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<dialog id="taskDialog">
  <form method="dialog" id="taskForm">
    <h2 id="taskHead">New task</h2>
    <label>Task <input name="title" required maxlength="300" autocomplete="off" placeholder="What needs doing?"></label>
    <label>Notes <textarea name="notes" maxlength="5000" placeholder="Optional"></textarea></label>
    <div class="field">Due
      <input name="due_on" type="date">
      <div class="quick" id="dueQuick">
        <button type="button" class="chip" data-due="0">Today</button>
        <button type="button" class="chip" data-due="1">Tomorrow</button>
        <button type="button" class="chip" data-due="week">Next week</button>
        <button type="button" class="chip" data-due="">No date</button>
      </div>
    </div>
    <div class="field">Priority
      <div class="seg">
        <label><input type="radio" name="priority" value="0" checked><span>None</span></label>
        <label><input type="radio" name="priority" value="1"><span><span class="pd"><i></i></span>Low</span></label>
        <label><input type="radio" name="priority" value="2"><span><span class="pd"><i></i><i></i></span>Med</span></label>
        <label><input type="radio" name="priority" value="3"><span><span class="pd hi"><i></i><i></i><i></i></span>High</span></label>
      </div>
    </div>
    <div class="two">
      <label>List <select name="list_id"></select></label>
      <label>Repeat
        <select name="repeat">
          <option value="">Never</option>
          <option value="daily">Every day</option>
          <option value="weekly">Every week</option>
          <option value="monthly">Every month</option>
          <option value="yearly">Every year</option>
        </select>
      </label>
    </div>
    <div class="actions">
      <div class="left"><button type="button" class="btn danger" id="deleteTask" hidden>Delete</button></div>
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="listDialog">
  <form method="dialog" id="listForm">
    <h2 id="listHead">New list</h2>
    <label>Name <input name="name" required maxlength="60" autocomplete="off" placeholder="e.g. Work, Home, Groceries"></label>
    <div class="actions">
      <div class="left"><button type="button" class="btn danger" id="deleteList" hidden>Delete</button></div>
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<div class="toast mono" id="toast" role="status" hidden><span id="toastMsg"></span><button type="button" id="toastAct" hidden></button></div>

<script>
"use strict";
const SCHEMA = "todos";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CHECK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const I_CAL = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>';
const I_REPEAT = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 014-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 01-4 4H4"/></svg>';
const I_LIST = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>';
const I_EDIT = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>';
const REPEAT_TEXT = { daily: "daily", weekly: "weekly", monthly: "monthly", yearly: "yearly" };

// Dates are "YYYY-MM-DD" strings with arithmetic in UTC, so the phone's time zone
// never shifts a day. "Today" comes from Postgres.
const toDate = s => new Date(s + "T00:00:00Z");
const iso = d => d.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = toDate(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const weekday = s => (toDate(s).getUTCDay() + 6) % 7; // Monday = 0
const fmtDay = (s, opts) => toDate(s).toLocaleDateString(undefined, { timeZone: "UTC", ...opts });

let S = { today: null, lists: [], tasks: [] };
let tab = "today", list = "all", query = "";   // list: "all", "inbox" or a list id
try { tab = localStorage.getItem("todos.tab") || tab; list = localStorage.getItem("todos.list") || list; } catch (e) {}
const remember = () => { try { localStorage.setItem("todos.tab", tab); localStorage.setItem("todos.list", list); } catch (e) {} };

const rpc = (fn, args, opts) => exo.rpc(SCHEMA, fn, args, opts);

let toastTimer, toastAction = null;
function toast(msg, actionLabel, action) {
  $("#toastMsg").textContent = msg;
  $("#toastAct").hidden = !actionLabel;
  $("#toastAct").textContent = actionLabel || "";
  toastAction = action || null;
  $("#toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("#toast").hidden = true; toastAction = null; }, actionLabel ? 5000 : 3500);
}
$("#toastAct").addEventListener("click", () => {
  const a = toastAction;
  $("#toast").hidden = true; toastAction = null;
  if (a) a();
});

async function load() {
  try {
    S = await rpc("state", { done_days: 30 }, { read: true });
    if (list !== "all" && list !== "inbox" && !S.lists.some(l => String(l.id) === list)) list = "all";
    render();
  } catch (e) {
    toast("Couldn't load: " + e.message);
  }
}

// ---- views ------------------------------------------------------------------------

const open = () => S.tasks.filter(t => !t.done_at);
const inList = t => list === "all" || (list === "inbox" ? t.list_id == null : String(t.list_id) === list);
const listName = id => S.lists.find(l => l.id === id)?.name;
const byDue = (a, b) => (a.due_on || "9999") < (b.due_on || "9999") ? -1 : (a.due_on || "9999") > (b.due_on || "9999") ? 1
  : b.priority - a.priority || (a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : a.id - b.id);

function dayLabel(d, { long = false } = {}) {
  const t = S.today;
  if (d === t) return "Today";
  if (d === addDays(t, 1)) return "Tomorrow";
  if (d === addDays(t, -1)) return "Yesterday";
  if (d > t && d <= addDays(t, 6)) return fmtDay(d, { weekday: "long" });
  const sameYear = d.slice(0, 4) === t.slice(0, 4);
  return fmtDay(d, { weekday: long || d > t ? "short" : undefined, day: "numeric", month: "short", year: sameYear ? undefined : "numeric" });
}

function taskRow(t) {
  const done = !!t.done_at;
  const meta = [];
  if (t.due_on && !done) {
    const cls = t.due_on < S.today ? "late" : t.due_on === S.today ? "today" : "";
    meta.push(`<span class="${cls}">${I_CAL}${esc(dayLabel(t.due_on))}</span>`);
  }
  if (t.repeat && !done) meta.push(`<span>${I_REPEAT}${REPEAT_TEXT[t.repeat]}</span>`);
  if (list === "all" && t.list_id != null && tab !== "all") meta.push(`<span>${I_LIST}${esc(listName(t.list_id) || "")}</span>`);
  const name = esc(t.title);
  return `<div class="task p${done ? 0 : t.priority} ${done ? "done" : ""}" data-id="${t.id}">
    <button class="tick" data-act="toggle" aria-label="${done ? "Mark not done" : "Mark done"}: ${name}" aria-pressed="${done}"><i>${CHECK}</i></button>
    <button class="body" data-act="edit" aria-label="Edit: ${name}">
      <div class="title">${name}</div>
      <div class="meta">${meta.join("")}</div>
      ${t.notes ? `<div class="notes">${esc(t.notes.split("\n")[0])}</div>` : ""}
    </button>
  </div>`;
}

const group = (title, tasks, cls = "", extra = "") => !tasks.length ? "" :
  (title ? `<h2 class="section-title ${cls}">${esc(title)} <span class="count">${String(tasks.length).padStart(2, "0")}</span>${extra}</h2>` : extra)
  + `<div class="group">${tasks.map(taskRow).join("")}</div>`;

const empty = (head, text) => `<div class="empty-state"><p class="display">${esc(head)}</p><p>${esc(text)}</p></div>`;

function render() {
  const t = S.today;
  const all = open();
  const late = all.filter(x => x.due_on && x.due_on < t).length;
  const dueToday = all.filter(x => x.due_on === t).length;
  $("#date").textContent = t ? fmtDay(t, { weekday: "short", day: "2-digit", month: "short" }) : "";
  $("#summary").innerHTML = t ? `<span class="big">${String(all.length).padStart(2, "0")}</span><span class="small">open${late ? ` · <span class="late">${late} overdue</span>` : dueToday ? ` · ${dueToday} today` : ""}</span>` : "";

  const scoped = all.filter(inList);
  const counts = {
    today: scoped.filter(x => x.due_on && x.due_on <= t).length,
    upcoming: scoped.filter(x => x.due_on > t).length,
    all: scoped.length,
    done: S.tasks.filter(x => x.done_at && inList(x)).length,
  };
  document.querySelectorAll("#tabs button").forEach(b => {
    b.setAttribute("aria-selected", String(b.dataset.tab === tab));
    const n = counts[b.dataset.tab];
    b.innerHTML = `${b.dataset.tab}${n && b.dataset.tab !== "done" ? `<span class="n">${n}</span>` : ""}`;
  });

  const chip = (key, label, n) => {
    const on = list === key;
    return `<button class="chip" data-list="${key}" aria-pressed="${on}">${esc(label)}${n ? `<span class="n">${n}</span>` : ""}${on && key !== "all" && key !== "inbox" ? I_EDIT : ""}</button>`;
  };
  $("#chips").innerHTML = chip("all", "All lists", 0)
    + chip("inbox", "Inbox", all.filter(x => x.list_id == null).length)
    + S.lists.map(l => chip(String(l.id), l.name, all.filter(x => x.list_id === l.id).length)).join("")
    + `<button class="chip new" data-list="new" aria-label="New list">+ List</button>`;

  $("#tabs").classList.toggle("dim", !!query);
  $("#list").innerHTML = query ? renderSearch() : ({ today: renderToday, upcoming: renderUpcoming, all: renderAll, done: renderDone })[tab](scoped);
}

// Every word has to appear in the title or notes; searches all tabs within the picked list.
function renderSearch() {
  const words = query.toLowerCase().split(/\s+/).filter(Boolean);
  const hit = x => { const text = `${x.title} ${x.notes || ""}`.toLowerCase(); return words.every(w => text.includes(w)); };
  const found = S.tasks.filter(x => inList(x) && hit(x));
  if (!found.length) return empty("No matches", `Nothing ${list === "all" ? "" : "in this list "}matches “${query}”`);
  const openOnes = found.filter(x => !x.done_at).sort(byDue);
  const doneOnes = found.filter(x => x.done_at).sort((a, b) => a.done_at < b.done_at ? 1 : -1);
  return group("Open", openOnes) + group("Done", doneOnes);
}

function renderToday(tasks) {
  const t = S.today;
  const late = tasks.filter(x => x.due_on && x.due_on < t).sort(byDue);
  const today = tasks.filter(x => x.due_on === t).sort(byDue);
  if (!late.length && !today.length) {
    const rest = tasks.length;
    return empty("Nothing due today", rest ? `${rest} other open task${rest === 1 ? "" : "s"} under All` : "Tap + to add one");
  }
  return group("Overdue", late, "late") + group("Today", today);
}

function renderUpcoming(tasks) {
  const t = S.today;
  const future = tasks.filter(x => x.due_on > t).sort(byDue);
  if (!future.length) return empty("Nothing scheduled", "Tasks due after today show up here");
  const days = new Map();
  for (const x of future) (days.get(x.due_on) || days.set(x.due_on, []).get(x.due_on)).push(x);
  return [...days].map(([d, xs]) => group(dayLabel(d, { long: true }), xs)).join("");
}

function renderAll(tasks) {
  if (!tasks.length) return empty("All clear", "No open tasks here. Tap + to add one");
  const sorted = [...tasks].sort(byDue);
  if (list !== "all") return group("", sorted);
  const out = [group("Inbox", sorted.filter(x => x.list_id == null))];
  for (const l of S.lists) out.push(group(l.name, sorted.filter(x => x.list_id === l.id)));
  return out.join("");
}

function renderDone() {
  const done = S.tasks.filter(x => x.done_at && inList(x)).sort((a, b) => a.done_at < b.done_at ? 1 : -1);
  if (!done.length) return empty("Nothing done yet", "Tasks you tick off in the last 30 days show up here");
  const days = new Map();
  for (const x of done) (days.get(x.done_on) || days.set(x.done_on, []).get(x.done_on)).push(x);
  let first = true;
  return [...days].map(([d, xs]) => {
    const extra = first ? `<button class="link" data-act="clear">Clear all done</button>` : "";
    first = false;
    return group(dayLabel(d, { long: true }), xs, "", extra);
  }).join("");
}

// ---- search and add ---------------------------------------------------------------

$("#q").addEventListener("input", e => {
  query = e.target.value.trim();
  $("#qClear").hidden = !e.target.value;
  render();
});
$("#q").addEventListener("keydown", e => {
  if (e.key === "Escape") clearSearch();
  if (e.key === "Enter") e.target.blur();
});
function clearSearch() {
  $("#q").value = ""; query = ""; $("#qClear").hidden = true; render();
}
$("#qClear").addEventListener("click", () => { clearSearch(); $("#q").focus(); });

// A new task starts from where you are: Today makes it due today, Upcoming
// tomorrow, and a picked list puts it in that list.
function newTaskDefaults() {
  return {
    due_on: query ? null : tab === "today" ? S.today : tab === "upcoming" ? addDays(S.today, 1) : null,
    list_id: list === "all" || list === "inbox" ? null : Number(list),
  };
}

$("#add").addEventListener("click", () => openTask(null, newTaskDefaults()));

// ---- task actions -----------------------------------------------------------------

const taskById = id => S.tasks.find(t => t.id === Number(id));

async function setDone(t, done) {
  try {
    await rpc("update_task", { task_id: t.id, patch: { done } });
  } catch (e) {
    toast("Not saved: " + e.message);
  }
  await load();
}

$("#list").addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  if (b.dataset.act === "clear") return clearDone();
  const t = taskById(b.closest(".task")?.dataset.id);
  if (!t) return;
  if (b.dataset.act === "edit") return openTask(t);
  // Tick: show it done for a moment, then let it move on.
  const row = b.closest(".task");
  const done = !t.done_at;
  row.classList.toggle("done", done);
  row.classList.add("leaving");
  setTimeout(async () => {
    await setDone(t, done);
    if (done) toast(t.repeat ? `Done. Next one ${dayLabelNext(t)}` : "Done", "Undo", () => setDone(t, false));
  }, 300);
});

function dayLabelNext(t) {
  const next = S.tasks.find(x => !x.done_at && x.title === t.title && x.repeat === t.repeat && x.due_on > S.today);
  return next ? dayLabel(next.due_on).toLowerCase() : "is scheduled";
}

async function clearDone() {
  const n = S.tasks.filter(x => x.done_at).length;
  if (!confirm(`Delete all ${n} completed task${n === 1 ? "" : "s"}? This can't be undone.`)) return;
  try { await rpc("clear_done"); } catch (e) { toast(e.message); }
  load();
}

document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => {
  tab = b.dataset.tab; remember();
  if (query) { $("#q").value = ""; query = ""; $("#qClear").hidden = true; }
  render();
}));

$("#chips").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  const key = b.dataset.list;
  if (key === "new") return openList(null);
  if (key === list && key !== "all" && key !== "inbox") return openList(S.lists.find(l => String(l.id) === key));
  list = key; remember(); render();
});

document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => b.closest("dialog").close()));
document.querySelectorAll("dialog").forEach(d => d.addEventListener("click", e => { if (e.target === d) d.close(); }));

// ---- task dialog ------------------------------------------------------------------

let editing = null;
const tf = $("#taskForm");

function openTask(t, defaults = {}) {
  editing = t;
  tf.reset();
  $("#taskHead").textContent = t ? (t.done_at ? "Completed task" : "Edit task") : "New task";
  tf.list_id.innerHTML = `<option value="">Inbox</option>` + S.lists.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join("");
  const v = t || defaults;
  tf.title.value = v.title || "";
  tf.notes.value = v.notes || "";
  tf.due_on.value = v.due_on || "";
  tf.priority.value = String(v.priority || 0);
  tf.list_id.value = v.list_id == null ? "" : String(v.list_id);
  tf.repeat.value = v.repeat || "";
  $("#deleteTask").hidden = !t;
  $("#taskDialog").showModal();
  if (!t) tf.title.focus();
}

$("#dueQuick").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  const d = b.dataset.due;
  tf.due_on.value = d === "" ? "" : d === "week" ? addDays(S.today, 7 - weekday(S.today)) : addDays(S.today, Number(d));
});

tf.addEventListener("submit", async e => {
  e.preventDefault();
  const body = {
    title: tf.title.value.trim(),
    notes: tf.notes.value.trim() || null,
    due_on: tf.due_on.value || null,
    priority: Number(tf.priority.value),
    list_id: tf.list_id.value ? Number(tf.list_id.value) : null,
    repeat: tf.repeat.value || null,
  };
  if (body.repeat && !body.due_on) return toast("A repeating task needs a due date");
  try {
    if (editing) await rpc("update_task", { task_id: editing.id, patch: body });
    else await rpc("create_task", body);
    $("#taskDialog").close();
    load();
  } catch (err) {
    toast(err.message);
  }
});

$("#deleteTask").addEventListener("click", async () => {
  if (!editing) return;
  const t = editing;
  $("#taskDialog").close();
  try {
    await rpc("delete_task", { task_id: t.id });
    await load();
    toast("Deleted", "Undo", async () => {
      try {
        await rpc("create_task", { title: t.title, notes: t.notes, list_id: t.list_id, due_on: t.due_on, priority: t.priority, repeat: t.repeat });
        if (t.done_at) toast("Restored as not done");
      } catch (e) { toast(e.message); }
      load();
    });
  } catch (e) { toast(e.message); }
});

// ---- list dialog ------------------------------------------------------------------

let editingList = null;
const lf = $("#listForm");

function openList(l) {
  editingList = l;
  lf.reset();
  $("#listHead").textContent = l ? "Edit list" : "New list";
  lf.name.value = l?.name || "";
  $("#deleteList").hidden = !l;
  $("#listDialog").showModal();
  lf.name.focus();
}

lf.addEventListener("submit", async e => {
  e.preventDefault();
  try {
    const name = lf.name.value.trim();
    const res = editingList
      ? await rpc("rename_list", { list_id: editingList.id, name })
      : await rpc("create_list", { name });
    $("#listDialog").close();
    list = String(res.id); remember();
    load();
  } catch (err) { toast(err.message); }
});

$("#deleteList").addEventListener("click", async () => {
  const l = editingList;
  if (!l) return;
  const n = open().filter(x => x.list_id === l.id).length;
  if (!confirm(`Delete the list "${l.name}"?${n ? ` Its ${n} open task${n === 1 ? "" : "s"} move to the Inbox.` : ""}`)) return;
  try {
    await rpc("delete_list", { list_id: l.id });
    $("#listDialog").close();
    list = "all"; remember();
    load();
  } catch (err) { toast(err.message); }
});

// Pick up a new day (and changes made through the MCP server) when the tab comes back.
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });

load();
</script>
</body>
</html>
