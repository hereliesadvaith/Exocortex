<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f0f0ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Habits</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23d71921'/%3E%3C/svg%3E">
<link rel="preload" href="/fonts/doto.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/ui.css">
<script src="/ui.js"></script>
<style>
main { padding-bottom: 110px; }

/* Today's progress: one dot per active habit. */
.progress-dots { display: flex; flex-wrap: wrap; gap: 6px; margin: -6px 2px 22px; }
.progress-dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--dot-off); }
.progress-dots i.on { background: var(--text); }

.habit { padding: 16px 16px 14px; margin-bottom: 10px; }
.habit.done .name { color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.name { font-weight: 650; font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
.meta { margin-top: 4px; font: 11px/1.4 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.meta .streak { color: var(--red); }

/* Done / not: a circle that fills. */
.check {
  width: 50px; height: 50px; border-radius: 50%; flex: none; display: grid; place-items: center;
  border: 1.5px solid var(--text); background: transparent; color: var(--bg); transition: background 0.15s, transform 0.1s;
}
.check:active { transform: scale(0.93); }
.check svg { opacity: 0; transition: opacity 0.15s; }
.check.on { background: var(--text); }
.check.on svg { opacity: 1; }

/* Count / minutes: − value + */
.stepper { display: flex; align-items: center; flex: none; border: 1.5px solid var(--text); border-radius: 999px; }
.stepper button { border: 0; background: transparent; width: 40px; height: 44px; font-size: 22px; line-height: 1; border-radius: 999px; }
.stepper button:active { background: var(--line); }
.stepper .val { width: auto; min-width: 62px; padding: 0 2px; white-space: nowrap; font: 800 20px/1 var(--display); }
.stepper .val small { font: 11px/1 var(--mono); color: var(--muted); }
.stepper.met { background: var(--text); color: var(--bg); }
.stepper.met .val small { color: var(--bg); opacity: 0.7; }

/* Last seven days */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 14px; }
.day { border: 0; background: transparent; padding: 2px 0; display: flex; flex-direction: column; align-items: center; gap: 5px; font: 10px/1 var(--mono); color: var(--muted); }
.day .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--dot-off); position: relative; }
.day.partial .dot { background: var(--muted); opacity: 0.55; }
.day.met .dot { background: var(--text); }
.day.today { color: var(--text); font-weight: 700; }
.day.today .dot { box-shadow: 0 0 0 2px var(--card), 0 0 0 3.5px var(--red); }
.day.note .dot::after { content: ""; position: absolute; right: -3px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); border: 2px solid var(--card); }

/* History: 16 weeks of dots */
.heat-wrap { display: grid; grid-template-columns: auto 1fr; gap: 8px; margin-top: 14px; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; }
.heat .c { aspect-ratio: 1; border-radius: 50%; background: var(--dot-off); border: 0; padding: 0; }
.heat .c.partial { background: var(--muted); opacity: 0.55; }
.heat .c.met { background: var(--text); }
.heat .c.before, .heat .c.future { background: transparent; pointer-events: none; }
.heat .c.before { box-shadow: inset 0 0 0 1px var(--line); }
.heat .c.today { box-shadow: 0 0 0 1.5px var(--red); }
.heat-labels { display: grid; grid-template-rows: repeat(7, 1fr); gap: 3px; font: 9px/1 var(--mono); color: var(--muted); }
.heat-labels span { display: flex; align-items: center; }
.hstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-top: 14px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--line); }
.hstats div { background: var(--card); padding: 10px 12px; }
.hstats b { display: block; font: 800 20px/1 var(--display); }
.hstats span { display: block; margin-top: 4px; font: 10px/1.2 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

.archived { padding: 12px 16px; margin-bottom: 8px; }
.archived .name { color: var(--muted); font-size: 15px; }
.done-label { display: flex; align-items: center; gap: 10px; font: 15px/1 var(--sans); color: var(--text); }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
</style>
</head>
<body>
<main>
  <a class="back" href="/">Home</a>
  <header class="app-top">
    <div>
      <h1>Habits</h1>
      <p class="sub" id="date">&nbsp;</p>
    </div>
    <div class="side" id="progress"></div>
  </header>
  <div class="progress-dots" id="dots" aria-hidden="true"></div>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" data-tab="history" aria-selected="false">History</button>
  </div>

  <div id="list"></div>
</main>

<button class="fab" id="add" aria-label="New habit">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<dialog id="habitDialog">
  <form method="dialog" id="habitForm">
    <h2 id="habitTitle">New habit</h2>
    <label>Name <input name="name" required maxlength="80" autocomplete="off" placeholder="e.g. Read, Walk, Water"></label>
    <div class="field">Type
      <div class="seg">
        <label><input type="radio" name="kind" value="check" checked><span>Done / not</span></label>
        <label><input type="radio" name="kind" value="count"><span>Count</span></label>
        <label><input type="radio" name="kind" value="minutes"><span>Minutes</span></label>
      </div>
    </div>
    <div class="two">
      <label id="targetLabel" hidden><span id="targetText">Daily target</span> <input name="target" type="number" min="0.01" step="any" inputmode="decimal"></label>
      <label>Days per week
        <select name="times_per_week">
          <option value="7">Every day</option>
          <option value="6">6 days</option><option value="5">5 days</option><option value="4">4 days</option>
          <option value="3">3 days</option><option value="2">2 days</option><option value="1">1 day</option>
        </select>
      </label>
    </div>
    <div class="actions">
      <div class="left">
        <button type="button" class="btn plain" id="archiveBtn" hidden>Archive</button>
        <button type="button" class="btn danger" id="deleteBtn" hidden>Delete</button>
      </div>
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="logDialog">
  <form method="dialog" id="logForm">
    <h2 id="logTitle"></h2>
    <div class="sub" id="logSub"></div>
    <label id="logValueLabel"><span id="logValueText">Value</span> <input name="value" type="number" min="0" step="any" inputmode="decimal"></label>
    <div class="quick" id="quick"></div>
    <label id="logDoneLabel" class="plain done-label"><input type="checkbox" name="done"> Done</label>
    <label>Note <textarea name="note" maxlength="500" placeholder="Optional"></textarea></label>
    <div class="actions">
      <div class="left"><button type="button" class="btn danger" id="clearLog">Clear</button></div>
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<script>
"use strict";
const SCHEMA = "habits";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CHECK_SVG = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const DOTS_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';
const WEEK_LETTERS = ["M", "T", "W", "T", "F", "S", "S"];
const HEAT_WEEKS = 16;

// Dates are "YYYY-MM-DD" strings, with arithmetic in UTC so the phone's time zone
// never shifts a day. "Today" comes from Postgres.
const toDate = s => new Date(s + "T00:00:00Z");
const iso = d => d.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = toDate(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const weekday = s => (toDate(s).getUTCDay() + 6) % 7; // Monday = 0
const fmtDay = (s, opts) => toDate(s).toLocaleDateString(undefined, { timeZone: "UTC", ...opts });

let S = { today: null, habits: [], logs: {} };
let tab = "today";
try { tab = localStorage.getItem("habits.tab") || "today"; } catch (e) {}

const rpc = (fn, args, opts) => exo.rpc(SCHEMA, fn, args, opts);
const toast = msg => exo.toast(msg);

async function load() {
  try {
    const data = await rpc("state", { days: HEAT_WEEKS * 7 + 7 }, { read: true });
    const logs = {};
    for (const l of data.logs) (logs[l.habit_id] ||= {})[l.logged_on] = { value: Number(l.value), note: l.note };
    data.habits.forEach(h => { h.target = h.target == null ? null : Number(h.target); });
    S = { today: data.today, habits: data.habits, logs };
    render();
  } catch (e) {
    toast("Couldn't load: " + e.message);
  }
}

const logOf = (h, day) => S.logs[h.id]?.[day];
const goal = h => h.kind === "check" ? 1 : h.target;
const isMet = (h, day) => (logOf(h, day)?.value ?? 0) >= goal(h);
const unit = h => h.kind === "minutes" ? "min" : "";
const num = v => Number.isInteger(v) ? String(v) : String(+v.toFixed(2));

function metaText(h) {
  const parts = [];
  if (h.kind !== "check") parts.push(`${num(h.target)}${h.kind === "minutes" ? " min" : ""} a day`);
  if (h.times_per_week < 7) parts.push(`${Number(h.done_this_week)}/${h.times_per_week} this week`);
  else if (h.kind === "check") parts.push("daily");
  const n = Number(h.current_streak);
  if (n) parts.push(`<span class="streak">${n}-${h.streak_unit === "days" ? "day" : "week"} streak</span>`);
  return parts.join(" · ");
}

function render() {
  const active = S.habits.filter(h => h.active);
  $("#date").textContent = S.today ? fmtDay(S.today, { weekday: "short", day: "2-digit", month: "short" }) : "";
  const done = active.filter(h => isMet(h, S.today)).length;
  $("#progress").innerHTML = active.length ? `<span class="big">${done}/${active.length}</span><span class="small">done today</span>` : "";
  $("#dots").innerHTML = active.map(h => `<i class="${isMet(h, S.today) ? "on" : ""}"></i>`).join("");
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  $("#list").innerHTML = tab === "today" ? renderToday(active) : renderHistory(active);
}

function renderToday(active) {
  if (!active.length) {
    return `<div class="empty-state"><p class="display">No habits yet</p><p>Tap + to add your first one</p></div>`;
  }
  // Undone first, keeping the habits' own order otherwise.
  const sorted = [...active].sort((a, b) => isMet(a, S.today) - isMet(b, S.today));
  return sorted.map(h => {
    const met = isMet(h, S.today);
    const v = logOf(h, S.today)?.value ?? 0;
    const control = h.kind === "check"
      ? `<button class="check ${met ? "on" : ""}" data-act="toggle" data-id="${h.id}" aria-label="${met ? "Undo" : "Mark done"}: ${esc(h.name)}" aria-pressed="${met}">${CHECK_SVG}</button>`
      : `<div class="stepper ${met ? "met" : ""}">
           <button data-act="step" data-id="${h.id}" data-d="-1" aria-label="Less">−</button>
           <button class="val" data-act="log" data-id="${h.id}" data-day="${S.today}" aria-label="Edit value">${num(v)}<small>/${num(h.target)}</small></button>
           <button data-act="step" data-id="${h.id}" data-d="1" aria-label="More">+</button>
         </div>`;
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = addDays(S.today, -i);
      const l = logOf(h, d);
      const cls = [isMet(h, d) ? "met" : l ? "partial" : "", d === S.today ? "today" : "", l?.note ? "note" : ""].join(" ");
      const label = fmtDay(d, { weekday: "long", day: "numeric", month: "short" });
      days.push(`<button class="day ${cls}" data-act="${h.kind === "check" && d !== S.today ? "toggleDay" : "log"}" data-id="${h.id}" data-day="${d}" aria-label="${esc(label)}${l ? ": " + num(l.value) : ""}"><span class="dot"></span>${WEEK_LETTERS[weekday(d)]}</button>`);
    }
    return `<div class="card habit ${met ? "done" : ""}">
      <div class="row">
        <div class="grow"><div class="name">${esc(h.name)}</div><div class="meta">${metaText(h)}</div></div>
        <button class="icon-btn" data-act="edit" data-id="${h.id}" aria-label="Edit ${esc(h.name)}">${DOTS_SVG}</button>
        ${control}
      </div>
      <div class="week">${days.join("")}</div>
    </div>`;
  }).join("");
}

function renderHistory(active) {
  const archived = S.habits.filter(h => !h.active);
  if (!active.length && !archived.length) {
    return `<div class="empty-state"><p class="display">Nothing here yet</p><p>History shows up once you add habits</p></div>`;
  }
  const start = addDays(S.today, -weekday(S.today) - (HEAT_WEEKS - 1) * 7);
  const out = active.map(h => {
    const cells = [];
    let metDays = 0, window = 0;
    for (let i = 0; i < HEAT_WEEKS * 7; i++) {
      const d = addDays(start, i);
      const l = logOf(h, d);
      let cls = d > S.today ? "future" : d < h.created_on && !l ? "before" : isMet(h, d) ? "met" : l ? "partial" : "";
      if (d === S.today) cls += " today";
      if (d <= S.today && d > addDays(S.today, -30) && (d >= h.created_on || l)) {
        window++;
        if (isMet(h, d)) metDays++;
      }
      const label = fmtDay(d, { weekday: "short", day: "numeric", month: "short" }) + (l ? `: ${num(l.value)}${l.note ? " — " + l.note : ""}` : "");
      cells.push(`<button class="c ${cls}" data-act="log" data-id="${h.id}" data-day="${d}" title="${esc(label)}" aria-label="${esc(label)}"></button>`);
    }
    const expected = h.times_per_week === 7 ? window : Math.round(window * h.times_per_week / 7);
    const pct = expected ? Math.min(100, Math.round(metDays / expected * 100)) : 0;
    return `<div class="card habit">
      <div class="row">
        <div class="grow"><div class="name">${esc(h.name)}</div><div class="meta">${metaText(h)}</div></div>
        <button class="icon-btn" data-act="edit" data-id="${h.id}" aria-label="Edit ${esc(h.name)}">${DOTS_SVG}</button>
      </div>
      <div class="heat-wrap">
        <div class="heat-labels">${WEEK_LETTERS.map((w, i) => `<span>${i % 2 === 0 ? w : ""}</span>`).join("")}</div>
        <div class="heat">${cells.join("")}</div>
      </div>
      <div class="hstats">
        <div><b>${Number(h.current_streak)}</b><span>${h.streak_unit === "days" ? "day" : "week"} streak</span></div>
        <div><b>${h.times_per_week === 7 ? Number(h.best_day_streak) : "—"}</b><span>best streak</span></div>
        <div><b>${pct}%</b><span>last 30 days</span></div>
      </div>
    </div>`;
  });
  if (archived.length) {
    out.push(`<h2 class="section-title">Archived <span class="count">${String(archived.length).padStart(2, "0")}</span></h2>`);
    out.push(...archived.map(h => `<div class="card archived"><div class="row">
      <div class="grow"><div class="name">${esc(h.name)}</div></div>
      <button class="btn plain" data-act="restore" data-id="${h.id}">Restore</button>
      <button class="icon-btn" data-act="edit" data-id="${h.id}" aria-label="Edit ${esc(h.name)}">${DOTS_SVG}</button>
    </div></div>`));
  }
  return out.join("");
}

// ---- changes ---------------------------------------------------------------------

// note: undefined keeps the day's existing note, null clears it.
async function setLog(h, day, value, note) {
  if (note === undefined) note = logOf(h, day)?.note ?? null;
  // Show the change right away, then refresh streaks from the database.
  if (value > 0) (S.logs[h.id] ||= {})[day] = { value, note };
  else if (S.logs[h.id]) delete S.logs[h.id][day];
  render();
  try {
    if (value > 0) await rpc("set_log", { habit_id: h.id, day, value, note });
    else await rpc("delete_log", { habit_id: h.id, day });
  } catch (e) {
    toast("Not saved: " + e.message);
  }
  load();
}

const habitById = id => S.habits.find(h => h.id === Number(id));

$("#list").addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const h = habitById(b.dataset.id);
  if (!h) return;
  const act = b.dataset.act;
  if (act === "toggle" || act === "toggleDay") {
    const day = b.dataset.day || S.today;
    setLog(h, day, isMet(h, day) ? 0 : 1);
  } else if (act === "step") {
    const step = h.kind === "minutes" ? 5 : 1;
    const v = logOf(h, S.today)?.value ?? 0;
    const next = Math.max(0, +(v + step * Number(b.dataset.d)).toFixed(2));
    if (next !== v) setLog(h, S.today, next);
  } else if (act === "log") {
    openLog(h, b.dataset.day);
  } else if (act === "edit") {
    openHabit(h);
  } else if (act === "restore") {
    saveHabit(h.id, { active: true });
  }
});

document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  tab = b.dataset.tab;
  try { localStorage.setItem("habits.tab", tab); } catch (e) {}
  render();
}));

document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => b.closest("dialog").close()));
document.querySelectorAll("dialog").forEach(d => d.addEventListener("click", e => { if (e.target === d) d.close(); }));

// ---- habit dialog ----------------------------------------------------------------

let editing = null;
const hf = $("#habitForm");

function syncKind() {
  const kind = hf.kind.value;
  $("#targetLabel").hidden = kind === "check";
  hf.target.required = kind !== "check";
  $("#targetText").textContent = kind === "minutes" ? "Minutes a day" : "Daily target";
}
hf.addEventListener("change", e => { if (e.target.name === "kind") syncKind(); });

function openHabit(h) {
  editing = h || null;
  hf.reset();
  $("#habitTitle").textContent = h ? "Edit habit" : "New habit";
  if (h) {
    hf.name.value = h.name;
    hf.kind.value = h.kind;
    hf.target.value = h.target ?? "";
    hf.times_per_week.value = String(h.times_per_week);
  }
  $("#archiveBtn").hidden = !h;
  $("#archiveBtn").textContent = h && !h.active ? "Restore" : "Archive";
  $("#deleteBtn").hidden = !h;
  syncKind();
  $("#habitDialog").showModal();
  if (!h) hf.name.focus();
}

async function saveHabit(id, body) {
  try {
    if (id) await rpc("update_habit", { habit_id: id, patch: body });
    else await rpc("create_habit", body);
    $("#habitDialog").close();
    load();
  } catch (e) {
    toast(e.message);
  }
}

hf.addEventListener("submit", e => {
  e.preventDefault();
  const kind = hf.kind.value;
  saveHabit(editing?.id, {
    name: hf.name.value.trim(),
    kind,
    target: kind === "check" ? null : Number(hf.target.value),
    times_per_week: Number(hf.times_per_week.value),
  });
});

$("#archiveBtn").addEventListener("click", () => editing && saveHabit(editing.id, { active: !editing.active }));
$("#deleteBtn").addEventListener("click", async () => {
  if (!editing || !confirm(`Delete "${editing.name}" and all its history? This can't be undone. Archive keeps the history.`)) return;
  try {
    await rpc("delete_habit", { habit_id: editing.id });
    $("#habitDialog").close();
    load();
  } catch (e) { toast(e.message); }
});
$("#add").addEventListener("click", () => openHabit(null));

// ---- log dialog -------------------------------------------------------------------

let logTarget = null;
const lf = $("#logForm");

function openLog(h, day) {
  logTarget = { h, day };
  const l = logOf(h, day);
  lf.reset();
  $("#logTitle").textContent = h.name;
  $("#logSub").textContent = fmtDay(day, { weekday: "long", day: "numeric", month: "long" })
    + (h.kind === "check" ? "" : ` · target ${num(h.target)}${unit(h) ? " " + unit(h) : ""}`);
  const isCheck = h.kind === "check";
  $("#logValueLabel").hidden = isCheck;
  $("#logDoneLabel").hidden = !isCheck;
  $("#logValueText").textContent = h.kind === "minutes" ? "Minutes" : "Count";
  lf.value.value = l ? num(l.value) : "";
  lf.done.checked = isCheck ? !!l : false;
  lf.note.value = l?.note ?? "";
  const q = $("#quick");
  q.hidden = isCheck;
  q.innerHTML = isCheck ? "" : (h.kind === "minutes" ? [5, 10, 15, 30] : [1, 2, 5]).map(n => `<button type="button" class="chip" data-add="${n}">+${n}</button>`).join("")
    + `<button type="button" class="chip" data-set="${h.target}">= target</button>`;
  $("#clearLog").hidden = !l;
  $("#logDialog").showModal();
}

$("#quick").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  const cur = Number(lf.value.value) || 0;
  lf.value.value = num(b.dataset.set != null ? Number(b.dataset.set) : cur + Number(b.dataset.add));
});

lf.addEventListener("submit", e => {
  e.preventDefault();
  const { h, day } = logTarget;
  const value = h.kind === "check" ? (lf.done.checked ? 1 : 0) : Number(lf.value.value) || 0;
  if (value <= 0 && lf.note.value.trim()) {
    toast(h.kind === "check" ? "Tick Done to save a note" : "Enter a value to save a note");
    return;
  }
  $("#logDialog").close();
  setLog(h, day, value, lf.note.value.trim() || null);
});

$("#clearLog").addEventListener("click", () => {
  const { h, day } = logTarget;
  $("#logDialog").close();
  setLog(h, day, 0);
});

// Pick up a new day (and changes made through the MCP server) when the tab comes back.
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });

load();
</script>
</body>
</html>
