# nginx's one site for the phone: http://localhost/ (127.0.0.1:80 only, so only apps on
# the phone can reach it; ngrok goes straight to the MCP server and never through here).
# ./start.sh links this file in as /etc/nginx/sites-enabled/exocortex.
#
#   /          the home page (home/app.py on 127.0.0.1:8003)
#   /<app>/    each app adds its own `location` blocks in /etc/nginx/localhost.d/<app>.conf,
#              and its app.json in /etc/exocortex/apps/ so the home page lists it.
server {
    listen 127.0.0.1:80 default_server;
    server_name localhost;

    # Keep redirects relative so they work for localhost and 127.0.0.1 alike.
    absolute_redirect off;

    include /etc/nginx/localhost.d/*.conf;

    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 20s;
    }
}
