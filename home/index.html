<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<title>Exocortex</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1d20'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%237fd1ae' stroke-width='2.6'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%237fd1ae'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f4f1;
  --surface: #ffffff;
  --surface-2: #ebebe7;
  --text: #19191b;
  --muted: #6b6c70;
  --line: #e2e2dd;
  --ok: #1f9d63;
  --ok-soft: #d9f1e5;
  --bad: #d23f31;
  --bad-soft: #fbe3df;
  --warn: #c98200;
  --bar: #3d64c8;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.05);
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111214;
    --surface: #1a1b1e;
    --surface-2: #25262a;
    --text: #ececef;
    --muted: #9898a0;
    --line: #2b2c31;
    --ok: #4fd195;
    --ok-soft: #173a2a;
    --bad: #ff7a6b;
    --bad-soft: #43201c;
    --warn: #f0b03c;
    --bar: #7d9bf0;
    --shadow: none;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 28px 16px 48px; }

header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 26px; }
.hello { color: var(--muted); font-size: 15px; }
h1 { margin: 2px 0 0; font-size: 32px; line-height: 1.1; letter-spacing: -.03em; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 13px 7px 11px; border-radius: 999px; font-size: 14px; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; margin-top: 4px; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.pill.ok .dot { box-shadow: 0 0 0 0 currentColor; animation: pulse 2.4s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 45%, transparent); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }
@media (prefers-reduced-motion: reduce) { .pill.ok .dot { animation: none; } }

h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 650; margin: 30px 4px 12px; display: flex; justify-content: space-between; align-items: baseline; }
h2 small { text-transform: none; letter-spacing: 0; font-weight: 500; }

.apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 18px 10px; }
.app { display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: var(--text); padding: 4px 0; border-radius: 16px; }
.app .tile { position: relative; width: 64px; height: 64px; border-radius: 19px; display: grid; place-items: center; box-shadow: 0 2px 10px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.18); transition: transform .12s; background-image: linear-gradient(160deg, rgba(255,255,255,.18), rgba(0,0,0,.08)); }
.app:active .tile { transform: scale(.93); }
.app .tile img { width: 34px; height: 34px; }
.app .tile .letter { color: #fff; font-weight: 700; font-size: 26px; }
.app .badge { position: absolute; right: -3px; top: -3px; width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--bg); background: var(--ok); }
.app.down .badge { background: var(--bad); }
.app.down .tile { filter: grayscale(.7); opacity: .75; }
.app .label { font-size: 13px; font-weight: 550; text-align: center; line-height: 1.2; }
.app .label small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; margin-top: 2px; }
.app.down .label small { color: var(--bad); }
.apps .none { grid-column: 1 / -1; color: var(--muted); font-size: 14px; padding: 6px 4px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
.rows > div { display: flex; align-items: center; gap: 12px; padding: 13px 16px; }
.rows > div + div { border-top: 1px solid var(--line); }
.rows .dot { width: 10px; height: 10px; color: var(--ok); }
.rows .bad .dot { color: var(--bad); }
.rows .name { font-weight: 600; }
.rows .detail { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.rows .bad .detail { color: var(--bad); }
.rows .right { margin-left: auto; text-align: right; color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rows .grow { min-width: 0; }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.stat { padding: 16px; }
.stat .k { color: var(--muted); font-size: 13px; font-weight: 600; }
.stat .v { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 14px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.meter { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin-top: 10px; }
.meter > i { display: block; height: 100%; border-radius: 4px; background: var(--ok); transition: width .4s; }
.meter.warn > i { background: var(--warn); }
.meter.hot > i { background: var(--bad); }
.loads { display: flex; gap: 16px; margin-top: 8px; font-size: 13px; color: var(--muted); }
.loads b { color: var(--text); font-size: 18px; font-variant-numeric: tabular-nums; display: block; }

.db-head { display: flex; gap: 22px; flex-wrap: wrap; padding: 16px 16px 6px; }
.schemas { padding: 4px 16px 14px; }
.schema { display: grid; grid-template-columns: minmax(80px, 1fr) auto; gap: 2px 12px; padding: 9px 0; }
.schema + .schema { border-top: 1px solid var(--line); }
.schema .n { font-weight: 600; font-family: var(--mono); font-size: 14px; }
.schema .s { text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; }
.schema .m { color: var(--muted); font-size: 12px; grid-column: 1 / -1; }
.schema .meter { grid-column: 1 / -1; height: 4px; margin-top: 4px; }
.schema .meter > i { background: var(--bar); }

.errs details { padding: 0 16px; }
.errs details + details { border-top: 1px solid var(--line); }
.errs summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 13px 0; font-weight: 600; }
.errs summary::-webkit-details-marker { display: none; }
.errs summary .count { margin-left: auto; color: var(--bad); font-size: 13px; font-weight: 600; }
.errs summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: -4px 4px 0 2px; transition: transform .15s; }
.errs details[open] summary::after { transform: rotate(-135deg); margin-top: 4px; }
.errs pre { margin: 0 0 14px; font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.errs pre .x { color: var(--bad); font-weight: 700; }
.errs .file { color: var(--muted); font: 11px var(--mono); margin: -6px 0 8px; }
.calm { padding: 16px; color: var(--muted); font-size: 14px; display: flex; gap: 10px; align-items: center; }
.calm .dot { color: var(--ok); }

footer { margin-top: 30px; text-align: center; color: var(--muted); font-size: 12px; }
.skeleton { color: var(--muted); padding: 16px; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="hello" id="hello">&nbsp;</div>
      <h1>Exocortex</h1>
    </div>
    <div class="pill" id="pill"><span class="dot"></span><span>Checking…</span></div>
  </header>

  <section>
    <h2>Apps</h2>
    <div class="apps" id="apps"><div class="none">Loading…</div></div>
  </section>

  <section>
    <h2>Services</h2>
    <div class="card rows" id="services"><div class="skeleton">Loading…</div></div>
  </section>

  <section>
    <h2>Phone</h2>
    <div class="grid2" id="host"></div>
  </section>

  <section>
    <h2>Database <small id="dbname"></small></h2>
    <div class="card" id="db"><div class="skeleton">Loading…</div></div>
  </section>

  <section>
    <h2>Recent errors</h2>
    <div class="card errs" id="errors"><div class="skeleton">Loading…</div></div>
  </section>

  <footer id="footer"></footer>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const REFRESH_MS = 15000;

function bytes(n) {
  if (n == null) return "–";
  const u = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return `${n >= 100 || i === 0 ? Math.round(n) : n.toFixed(1)} ${u[i]}`;
}
const count = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e4 ? Math.round(n / 1e3) + "k" : n.toLocaleString();
function ago(sec) {
  if (sec < 60) return `${Math.max(0, Math.round(sec))}s`;
  if (sec < 3600) return `${Math.round(sec / 60)}m`;
  if (sec < 86400) { const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60); return m ? `${h}h ${m}m` : `${h}h`; }
  const d = Math.floor(sec / 86400), h = Math.round((sec % 86400) / 3600);
  return h ? `${d}d ${h}h` : `${d}d`;
}

function greet() {
  const h = new Date().getHours();
  const part = h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
  $("#hello").textContent = `${part} · ${new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" })}`;
}

function renderApps(apps) {
  if (!apps.length) {
    $("#apps").innerHTML = `<div class="none">No apps registered yet. Each app links its app.json into /etc/exocortex/apps/.</div>`;
    return;
  }
  $("#apps").innerHTML = apps.map(a => {
    // The icon is drawn as an <img>, so whatever is in a manifest can't run script here.
    const icon = a.icon
      ? `<img alt="" src="data:image/svg+xml,${encodeURIComponent(a.icon)}">`
      : `<span class="letter">${esc(a.name[0] || "?")}</span>`;
    return `<a class="app ${a.ok ? "" : "down"}" href="${esc(a.path)}" title="${esc(a.description)}">
      <span class="tile" style="background-color:${esc(a.color)}">${icon}<span class="badge"></span></span>
      <span class="label">${esc(a.name)}${a.ok ? "" : "<small>down</small>"}</span>
    </a>`;
  }).join("");
}

function renderServices(services, now) {
  $("#services").innerHTML = services.map(s => {
    const right = s.ok && s.since ? `up ${ago(now - s.since)}` : s.ok && s.ms != null ? `${s.ms} ms` : "";
    const detail = s.id === "tunnel" && s.ok && s.url
      ? `<a href="${esc(s.url)}/mcp" style="color:inherit">${esc(s.detail)}</a>` : esc(s.detail);
    return `<div class="${s.ok ? "" : "bad"}">
      <span class="dot"></span>
      <div class="grow"><div class="name">${esc(s.name)}</div><div class="detail">${detail}</div></div>
      <div class="right">${s.ok ? right : "down"}</div>
    </div>`;
  }).join("");
}

function meter(frac) {
  const cls = frac > .9 ? "hot" : frac > .75 ? "warn" : "";
  return `<div class="meter ${cls}"><i style="width:${Math.round(frac * 100)}%"></i></div>`;
}

function renderHost(h) {
  const out = [];
  if (h.mem) {
    const used = h.mem.total - h.mem.available;
    out.push(`<div class="card stat"><div class="k">Memory</div>
      <div class="v">${bytes(used)} <small>of ${bytes(h.mem.total)} used</small></div>${meter(used / h.mem.total)}</div>`);
  }
  if (h.disk) {
    const used = h.disk.total - h.disk.free;
    out.push(`<div class="card stat"><div class="k">Storage</div>
      <div class="v">${bytes(h.disk.free)} <small>free of ${bytes(h.disk.total)}</small></div>${meter(used / h.disk.total)}</div>`);
  }
  if (h.load) {
    out.push(`<div class="card stat"><div class="k">Load average${h.cpus ? ` · ${h.cpus} cores` : ""}</div>
      <div class="loads">${["1 min", "5 min", "15 min"].map((l, i) => `<span><b>${h.load[i].toFixed(2)}</b>${l}</span>`).join("")}</div></div>`);
  }
  $("#host").innerHTML = out.join("") || `<div class="card skeleton">Not available here.</div>`;
}

function renderDb(db) {
  if (!db) {
    $("#dbname").textContent = "";
    $("#db").innerHTML = `<div class="calm" style="color:var(--bad)">Can't reach Postgres.</div>`;
    return;
  }
  $("#dbname").textContent = db.name;
  const max = Math.max(1, ...db.schemas.map(s => s.bytes));
  $("#db").innerHTML = `<div class="db-head">
      <div class="stat" style="padding:0"><div class="k">Size</div><div class="v">${bytes(db.bytes)}</div></div>
      <div class="stat" style="padding:0"><div class="k">Schemas</div><div class="v">${db.schemas.length}</div></div>
      <div class="stat" style="padding:0"><div class="k">Version</div><div class="v">${esc(db.version.split(" ")[0])}</div></div>
    </div>
    <div class="schemas">${db.schemas.map(s => `<div class="schema">
      <span class="n">${esc(s.schema)}</span><span class="s">${bytes(s.bytes)}</span>
      <span class="m">${s.tables} table${s.tables === 1 ? "" : "s"}${s.views ? ` · ${s.views} view${s.views === 1 ? "" : "s"}` : ""} · ≈${count(s.rows)} row${s.rows === 1 ? "" : "s"}</span>
      <div class="meter"><i style="width:${Math.max(1, s.bytes / max * 100)}%"></i></div>
    </div>`).join("")}</div>`;
}

const openErr = new Set();
function renderErrors(groups) {
  if (!groups.length) {
    $("#errors").innerHTML = `<div class="calm"><span class="dot"></span>No errors in the recent logs.</div>`;
    return;
  }
  $("#errors").innerHTML = groups.map(g => {
    const n = g.errors.reduce((a, e) => a + e.count, 0);
    const lines = g.errors.map(e => esc(e.line) + (e.count > 1 ? ` <span class="x">×${e.count}</span>` : "")).join("\n");
    return `<details data-src="${esc(g.source)}" ${openErr.has(g.source) ? "open" : ""}>
      <summary><span>${esc(g.source)}</span><span class="count">${n}</span></summary>
      <div class="file">${esc(g.file)}</div>
      <pre>${lines}</pre>
    </details>`;
  }).join("");
}
$("#errors").addEventListener("toggle", e => {
  const s = e.target.dataset?.src;
  if (s) e.target.open ? openErr.add(s) : openErr.delete(s);
}, true);

let last = null;
function renderPill(d) {
  const down = [...d.services, ...d.apps].filter(x => !x.ok);
  const pill = $("#pill");
  pill.className = "pill " + (down.length ? "bad" : "ok");
  pill.lastElementChild.textContent = down.length
    ? (down.length === 1 ? `${down[0].name} is down` : `${down.length} things down`)
    : "All systems normal";
}

function renderFooter() {
  $("#footer").textContent = last ? `Updated ${ago((Date.now() - last) / 1000)} ago · refreshes every ${REFRESH_MS / 1000}s` : "";
}

let timer = null;
async function load() {
  clearTimeout(timer);
  try {
    const res = await fetch("api/status", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const d = await res.json();
    last = Date.now();
    renderPill(d);
    renderApps(d.apps);
    renderServices(d.services, d.now);
    renderHost(d.host);
    renderDb(d.database);
    renderErrors(d.errors);
  } catch (e) {
    const pill = $("#pill");
    pill.className = "pill bad";
    pill.lastElementChild.textContent = "Home service not answering";
  }
  greet();
  renderFooter();
  if (!document.hidden) timer = setTimeout(load, REFRESH_MS);
}

document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); else clearTimeout(timer); });
setInterval(renderFooter, 5000);
load();
</script>
</body>
</html>
