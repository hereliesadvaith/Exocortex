# nginx locations for the job tracker: http://localhost/jobs/ -> FastAPI on 127.0.0.1:8004.
# Not a whole site: ./start.sh links it in as /etc/nginx/localhost.d/jobs.conf, which the
# localhost server from the exocortex repo (nginx/localhost.conf) includes.

location = /jobs { return 301 /jobs/; }

location /jobs/ {
    proxy_pass http://127.0.0.1:8004/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Prefix /jobs;
}
