# nginx locations for the habit tracker: http://localhost/habits/ -> FastAPI on 127.0.0.1:8001.
# Not a whole site: ./start.sh links it in as /etc/nginx/localhost.d/habits.conf, which the
# localhost server from the exocortex repo (nginx/localhost.conf) includes.

location = /habits { return 301 /habits/; }

location /habits/ {
    proxy_pass http://127.0.0.1:8001/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Prefix /habits;
}
