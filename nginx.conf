# nginx locations for the to-do app: http://localhost/todos/ -> FastAPI on 127.0.0.1:8002.
# Not a whole site: ./start.sh links it in as /etc/nginx/localhost.d/todos.conf, which the
# localhost server from the exocortex repo (nginx/localhost.conf) includes.

location = /todos { return 301 /todos/; }

location /todos/ {
    proxy_pass http://127.0.0.1:8002/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Prefix /todos;
}
