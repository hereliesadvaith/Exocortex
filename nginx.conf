# nginx site for the habit tracker: http://localhost/habits/ -> FastAPI on 127.0.0.1:8001.
# ./start.sh links this file in as /etc/nginx/sites-enabled/habits.
server {
    listen 127.0.0.1:80 default_server;
    server_name localhost;

    # Keep redirects relative so they work for localhost and 127.0.0.1 alike.
    absolute_redirect off;

    location = / { return 302 /habits/; }
    location = /habits { return 301 /habits/; }

    location /habits/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /habits;
    }
}
